name: Build and Deploy Devicera

on:
  push:
    branches: [main]
  # PRs run every check too. The GHCR login and the push below are
  # skipped on pull_request, so a PR can never move :latest, which
  # Watchtower deploys.
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Bump this deliberately and read the diff, rather than being bumped by it.
  # Same version as pubvera-recallis and pubvera-grantvera.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  # Browser E2E: the real embedded page, served by the real binary, in headless
  # Chromium. Every /api/* answer comes from e2e/fixtures and every other
  # external request is refused, so no live openFDA/PubMed/ClinicalTrials call
  # is made. The build job needs this one, so a failing browser test stops the
  # image from being built or pushed.
  e2e:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  build:
    needs: e2e
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # Vet and Gofmt run before Test, as in the other Pubvera apps. Test
      # alone let vet findings and unformatted code merge green; four files
      # had drifted out of gofmt before this gate existed.
      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt found unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt: zero files"

      - name: Test
        run: go test -race ./...
      # govulncheck reports known vulnerabilities in the standard library and in
      # dependencies, but only for code paths this module actually reaches. It
      # scans this module only; a CLI built from a pinned upstream commit in the
      # Dockerfile is a separate binary and is not covered.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

      - name: Check inline JavaScript
        run: |
          # go vet does not see the JavaScript embedded in index.html, so a
          # missing bracket there ships green and breaks the page at runtime.
          # Each <script> block is extracted and parsed with node --check.
          # This app keeps its page at web/index.html, not the repository root,
          # which is why both paths are tried. The Go suite above covers the
          # server; this covers the page, which go vet cannot reach.
          # A file that exists but yields no checkable block fails the build:
          # silently checking nothing is the failure mode this guards against.
          set -euo pipefail
          html=""
          for candidate in index.html web/index.html; do
            if [ -f "$candidate" ]; then html="$candidate"; break; fi
          done
          if [ -z "$html" ]; then
            echo "no index.html found - nothing to check"
            exit 0
          fi
          echo "checking $html"
          tmp=$(mktemp -d)
          node -e '
            const fs = require("fs"), path = require("path");
            const html = fs.readFileSync(process.argv[1], "utf8");
            const dir = process.argv[2];
            const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
            let m, i = 0;
            while ((m = re.exec(html)) !== null) {
              const attrs = m[1], body = m[2];
              if (body.trim() === "") continue;
              if (/\stype\s*=\s*["\x27](?!text\/javascript|module)/i.test(attrs)) continue;
              const isModule = /\stype\s*=\s*["\x27]module["\x27]/i.test(attrs);
              i += 1;
              fs.writeFileSync(path.join(dir, "block" + i + (isModule ? ".mjs" : ".js")), body);
            }
            console.log(i);
          ' "$html" "$tmp" > "$tmp/count"
          n=$(cat "$tmp/count")
          if [ "$n" -eq 0 ]; then
            echo "$html contains no inline script block - refusing to pass silently"
            exit 1
          fi
          for f in "$tmp"/block*; do
            node --check "$f"
          done
          echo "$n inline block(s) parse"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The server ran as root (UID 0, measured on the host with docker top on
      # 2026-10-10). This builds the image exactly as it ships WITHOUT pushing
      # it, starts it, waits for /healthz, then reads the UID of PID 1 from
      # /proc: the running process, not just the image's USER setting. The
      # runtime image has no wget, so the health request is made from the
      # runner. A server that cannot start is reported as a start failure, not
      # as a UID failure.
      - name: Build image for the non-root check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: devicera-nonroot-check:ci
          cache-from: type=gha

      - name: Check the image runs as non-root
        run: |
          set -euo pipefail
          want=10001
          cid=$(docker run -d -e PORT=8092 -p 127.0.0.1:18092:8092 devicera-nonroot-check:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:18092/healthz"; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "server did not answer /healthz within 30 s"
            docker logs "$cid" || true
            exit 1
          fi
          echo "healthz answered"
          uid=$(docker exec "$cid" awk '/^Uid:/ {print $2}' /proc/1/status)
          echo "expected uid: ${want}"
          echo "actual uid:   ${uid}"
          if [ "$uid" != "$want" ]; then
            echo "PID 1 runs as uid ${uid}, not ${want}"
            exit 1
          fi
          echo "PID 1 runs as non-root"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
